services:
  mysql:
    container_name: cm-mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cm_mall
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/all/cm_mall.sql:/docker-entrypoint-initdb.d/01-cm_mall.sql:ro
      - ../sql/all/cm_mall_data.sql:/docker-entrypoint-initdb.d/02-cm_mall_data.sql:ro
      - ../sql/xxl_job/tables_xxl_job.sql:/docker-entrypoint-initdb.d/03-tables_xxl_job.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: cm-redis
    image: redis:7
    ports:
      - "6379:6379"

  nacos:
    container_name: cm-nacos
    image: nacos/nacos-server:v3.0.3
    environment:
      MODE: standalone
      NACOS_AUTH_TOKEN: "TR21j0whe7UlQPISxv+TiuU3M5CS8HPKXRCuxNlbQrw="
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"

  nacos-init:
    container_name: cm-nacos-init
    image: curlimages/curl:latest
    depends_on:
      nacos:
        condition: service_started
    volumes:
      - ../nacos/config:/config:ro
      - ./sh/sync-nacos-config.sh:/sync.sh:ro
    entrypoint: ["/bin/sh", "/sync.sh", "nacos"]
    restart: "no"

  nginx:
    container_name: cm-nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    # Linux: host-gateway 自动解析为宿主机 IP（通常 172.17.0.1）
    # macOS/Windows Docker Desktop: 内置支持，此行可保留无副作用
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rocketmq-namesrv:
    container_name: cm-rocketmq-namesrv
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/root/logs

  rocketmq-broker:
    container_name: cm-rocketmq-broker
    image: apache/rocketmq:5.3.1
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    ports:
      - "10911:10911"
      - "10909:10909"
      - "8081:8081"
    volumes:
      - rocketmq-broker-logs:/root/logs
      - rocketmq-broker-store:/root/store

  elasticsearch:
    container_name: cm-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    # IK 分词插件：直接挂载 docs/docker/es-plugins/ik（含 plugin-descriptor.properties），
    # ES 启动时自动扫描加载，无需在线安装；离线包见 es-plugins/elasticsearch-analysis-ik-8.15.5.zip
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./es-plugins/ik:/usr/share/elasticsearch/plugins/ik
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  xxl-job-admin:
    container_name: cm-xxl-job-admin
    image: xuxueli/xxl-job-admin:3.4.2
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # xxl_job 库由 mysql init 脚本 03-tables_xxl_job.sql 创建；
      # accessToken 必须与 common.yaml 中 xxl.job.access-token 一致
      PARAMS: "--server.port=8080 --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=root --xxl.job.accessToken=cloudmall-xxl-job"
    ports:
      - "8088:8080"

volumes:
  mysql-data:
  elasticsearch-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
