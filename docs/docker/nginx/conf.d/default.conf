server {
    listen 80;
    charset utf-8;

    # ======================================================
    # 统一入口：所有 API 请求经 nginx 转发到 Spring Cloud Gateway
    #
    # Gateway 运行在宿主机 9000 端口（见 gateway/src/main/resources/application.yml），
    # 路由定义在 Nacos 配置 docs/nacos/config/gateway.yaml 中。
    #
    # 【本地开发】Gateway 在 IntelliJ 中运行，通过 host.docker.internal 可达
    # 【生产/容器化】改成 proxy_pass http://gateway:9000;
    #
    # 前端三个应用（web / manager / merchant）共用同一套后端 API，
    # API baseURL 统一为 http://localhost/api，nginx 在转发时剥离 /api 前缀
    # （proxy_pass 尾部 / 替换匹配前缀），网关按无前缀路径分发到各微服务。
    # ======================================================

    # ---------- /api 前缀 → Gateway（nginx 剥离 /api） ----------
    # 覆盖全部后端 API（users/roles/resources、addresses/shops/favorites、
    #   product/categories/banners/brands/comments/units/skus、orders/carts、
    #   coupons/merchant/operator、seckill、search、home 等）
    # proxy_pass 带 URI（尾部 /）时，匹配的 /api/ 前缀会被替换为 /，
    # 如 /api/home → /home，与网关 Nacos 路由路径对齐。
    location /api/ {
        proxy_pass http://host.docker.internal:9000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 直连网关前缀 → Gateway ----------
    # API 路径与网关 Nacos 路由定义对齐
    # （users/roles/resources、addresses/shops/favorites、product/categories/banners/
    #   brands/comments/units/skus、orders/carts、coupons/merchant/operator、
    #   seckill、search）
    location ~ ^/(users|roles|resources|addresses|shops|favorites|coupons|merchant|operator|product|categories|banners|brands|comments|units|skus|seckill|orders|carts|search)/ {
        proxy_pass http://host.docker.internal:9000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================================
    # 聊天 API + WebSocket → Gateway
    #
    # REST: /chat/sessions、/chat/sessions/{id}/messages、/chat/sessions/{id}/read
    # WebSocket: /chat/ws?token=xxx（浏览器 WS 无法携带请求头，token 走 query 参数）
    # ======================================================
    location /chat/ {
        proxy_pass http://host.docker.internal:9000;

        # WebSocket 升级必需
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 长连接不因默认 60s 超时被掐断（im-service 有心跳保活）
        proxy_read_timeout 3600s;

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================================
    # 前端页面兜底 → Vue Dev Server（运行在宿主机 9090 端口，web 主商城）
    #
    # 【本地开发】在 apps/web 目录下执行 npm run dev，
    # Vite 开发服务器监听 9090 端口并提供热更新。
    # manager 在 4000 端口、merchant 在 5173 端口，如需经 nginx 访问可自行加 location。
    # ======================================================
    location / {
        proxy_pass http://host.docker.internal:9090;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Vite 热更新 (HMR) 依赖 WebSocket，必须开启升级
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
