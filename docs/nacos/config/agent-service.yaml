spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cm_mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
  ai:
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          model: nvidia/nemotron-3-ultra-550b-a55b:free
      embedding:
        options:
          model: nvidia/nemotron-3-embed-1b:free

mybatis-plus:
  type-aliases-package: com.cloudmall.agent.entity

agent:
  # OpenCode Go：OpenAI 兼容的模型网关，聊天模型使用 deepseek-v4.1-flash。
  # API Key 通过环境变量注入；密钥缺失时自动回退到 spring.ai.openai 的聊天模型。
  opencode-go:
    enabled: true
    base-url: https://opencode.ai/inference/go/openai
#    api-key: ${OPENCODE_GO_API_KEY:${OPENCODE_API_KEY:}}
    api-key: oc_sk_e6db6a9bba37_CPpRQQPiQ0c5ZJvhl46xVzGxRyCAm5q-
    model: deepseek-v4.1-flash
  globalPrompt: |
    你运行在 Cloud Mall 电商平台 AI 客服系统中。
    请用中文以礼貌、专业、热情的语气回答用户的问题。
    回答内容应当简洁明了，必要时可提供详细解释。
  promptGroup: DEFAULT_GROUP
  readTimeout: 10000
  prompts:
    route:
      dataId: agent-prompt-route
    general:
      dataId: agent-prompt-general
    product:
      dataId: agent-prompt-product
    order:
      dataId: agent-prompt-order
    coupon:
      dataId: agent-prompt-coupon
    user:
      dataId: agent-prompt-user
  session:
    title: 你好，我是云小选
    describe: 我是 Cloud Mall 的 AI 购物助理云小选，商品推荐、订单进度、优惠券使用都可以问我。
    hot-topics:
      - title: 商品推荐
        describe: 帮我推荐一款适合通勤的降噪耳机
      - title: 订单查询
        describe: 我的订单什么时候发货？
      - title: 优惠券
        describe: 现在有哪些优惠券可以领？

logging:
  level:
    com.cloudmall.agent: debug
