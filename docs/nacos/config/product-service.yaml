mybatis-plus:
  type-aliases-package: com.cloudmall.product.entity

xxl:
  job:
    executor:
      app-name: product-service
      port: 9994
    auto-register:
      enabled: true
      jobs:
        - handler: outboxPublish
          desc: Outbox事件发布
          schedule-type: FIX_DELAY
          schedule-conf: "5"
        - handler: outboxCleanup
          desc: Outbox已发布记录清理
          schedule-type: CRON
          schedule-conf: "0 0 3 * * ?"
