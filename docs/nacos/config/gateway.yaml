auth:
  whitelist:
    - POST:/users/login
    - POST:/users/register
    - /coupons
    - /coupons/*
    - /search/**
    - /chat/ws
    - GET:/seckill/activities
    - GET:/seckill/activities/*
    - GET:/home
  url-permissions:
    - pattern: "GET:/merchant/**"
      permissions: [coupon:template:view, coupon:stats:view]
    - pattern: "POST:/merchant/coupons"
      permissions: [coupon:template:create]
    - pattern: "PUT:/merchant/coupons/**"
      permissions: [coupon:template:create]
    - pattern: "POST:/merchant/coupons/*/publish"
      permissions: [coupon:template:publish]
    - pattern: "POST:/merchant/coupons/*/pause"
      permissions: [coupon:template:pause]
    - pattern: "POST:/merchant/coupons/*/end"
      permissions: [coupon:template:end]
    - pattern: "DELETE:/merchant/coupons/**"
      permissions: [coupon:template:delete]
    - pattern: "GET:/merchant/coupons/*/stats"
      permissions: [coupon:stats:view]
    - pattern: "/operator/**"
      permissions: [coupon:user:view, coupon:user:revoke, coupon:manage]
    - pattern: "GET:/seckill/merchant/**"
      permissions: [seckill:product:view]
    - pattern: "POST:/seckill/activities/*/products"
      permissions: [seckill:product:submit]
    - pattern: "PATCH:/seckill/activities/*/products/*"
      permissions: [seckill:product:audit]
    - pattern: "POST:/seckill/activities/*/publish"
      permissions: [seckill:activity:publish]
    - pattern: "POST:/seckill/activities/*/cancel"
      permissions: [seckill:activity:cancel]
    - pattern: "POST:/seckill/activities"
      permissions: [seckill:activity:create]
    - pattern: "PATCH:/seckill/activities/*"
      permissions: [seckill:activity:create]
    - pattern: "GET:/seckill/operator/**"
      permissions: [seckill:activity:view, seckill:product:view]

spring:
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
      datasource:
        flow:
          nacos:
            server-addr: localhost:8848
            dataId: gateway-flow-rules
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users/**,/roles/**,/resources/**,/addresses/**,/shops/**,/favorites/**,/home/**
              filters:
                - StripPrefix=0

            - id: coupon-service
              uri: lb://coupon-service
              predicates:
                - Path=/coupons/**,/merchant/**,/operator/**
              filters:
                - StripPrefix=0

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/product/**,/categories/**,/banners/**,/brands/**,/comments/**,/units/**,/skus/**
              filters:
                - StripPrefix=0

            - id: seckill-service
              uri: lb://seckill-service
              predicates:
                - Path=/seckill/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**,/carts/**
              filters:
                - StripPrefix=0

            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/search/**
              filters:
                - StripPrefix=0

            - id: im-ws
              uri: lb:ws://im-service
              predicates:
                - Path=/chat/ws

            - id: im-rest
              uri: lb://im-service
              predicates:
                - Path=/chat/**
              filters:
                - StripPrefix=0
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
