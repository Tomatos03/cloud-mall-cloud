auth:
  whitelist:
    - /auth/sessions
    - /auth/users

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=0

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user/**,/favorites/**
              filters:
                - StripPrefix=0

            - id: coupon-service
              uri: lb://coupon-service
              predicates:
                - Path=/coupon/**
              filters:
                - StripPrefix=0

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/product/**,/category/**,/banner/**,/comment/**,/unit/**,/skus/**
              filters:
                - StripPrefix=0

            - id: seckill-service
              uri: lb://seckill-service
              predicates:
                - Path=/seckill/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order/**,/cart/**
              filters:
                - StripPrefix=0

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
