auth:
  whitelist:
    - /auth/sessions
    - /auth/users
    - /coupons
    - /coupons/*
    - /search/**
  url-permissions:
    - pattern: "GET:/merchant/**"
      permissions: [coupon:template:view, coupon:stats:view]
    - pattern: "POST:/merchant/coupons"
      permissions: [coupon:template:create]
    - pattern: "PUT:/merchant/coupons/**"
      permissions: [coupon:template:create]
    - pattern: "POST:/merchant/coupons/*/publish"
      permissions: [coupon:template:publish]
    - pattern: "POST:/merchant/coupons/*/pause"
      permissions: [coupon:template:pause]
    - pattern: "POST:/merchant/coupons/*/end"
      permissions: [coupon:template:end]
    - pattern: "DELETE:/merchant/coupons/**"
      permissions: [coupon:template:delete]
    - pattern: "GET:/merchant/coupons/*/stats"
      permissions: [coupon:stats:view]
    - pattern: "/operator/**"
      permissions: [coupon:user:view, coupon:user:revoke, coupon:manage]

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=0

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user/**,/favorites/**
              filters:
                - StripPrefix=0

            - id: coupon-service
              uri: lb://coupon-service
              predicates:
                - Path=/coupons/**,/merchant/**,/operator/**
              filters:
                - StripPrefix=0

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/product/**,/category/**,/banner/**,/comment/**,/unit/**,/skus/**
              filters:
                - StripPrefix=0

            - id: seckill-service
              uri: lb://seckill-service
              predicates:
                - Path=/seckill/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order/**,/cart/**
              filters:
                - StripPrefix=0

            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/search/**
              filters:
                - StripPrefix=0
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
