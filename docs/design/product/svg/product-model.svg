  <text x="600" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">多规格商品数据模型</text>

  <!-- 关联连线（画在表之上，箭头指向子表） -->
  <g stroke="#64748b" stroke-width="1.5" fill="none">
