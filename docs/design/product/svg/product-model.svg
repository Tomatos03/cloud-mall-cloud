    <!-- E2 brand 1→N product -->
    <line x1="900" y1="170" x2="820" y2="170" marker-end="url(#arr)"/>
    <!-- E3 product 1→N image -->
    <polyline points="410,282 410,354 300,354" marker-end="url(#arr)"/>
    <!-- E4 product 1→N sku -->
    <line x1="560" y1="282" x2="560" y2="360" marker-end="url(#arr)"/>
    <!-- E5 product 1→N spec_group -->
    <polyline points="795,282 795,320 855,320 855,360" marker-end="url(#arr)"/>
    <!-- E6 group 1→N spec_value -->
    <line x1="860" y1="502" x2="860" y2="560" marker-end="url(#arr)"/>
    <!-- E7 sku N→junction -->
    <line x1="435" y1="582" x2="500" y2="660" marker-end="url(#arr)"/>
    <!-- E8 value N→junction -->
    <line x1="760" y1="640" x2="700" y2="696" marker-end="url(#arr)"/>
  </g>

