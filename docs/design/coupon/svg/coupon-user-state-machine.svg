<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">用户券状态机</text>

  <!-- AVAILABLE -->
  <rect x="40" y="100" width="150" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d">AVAILABLE</text>
  <text x="115" y="150" text-anchor="middle" font-size="11" fill="#16a34a">可用</text>

  <!-- LOCKED -->
  <rect x="280" y="100" width="150" height="64" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">LOCKED</text>
  <text x="355" y="150" text-anchor="middle" font-size="11" fill="#3b82f6">已锁定</text>

  <!-- USED -->
  <rect x="520" y="100" width="150" height="64" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="595" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#4338ca">USED</text>
  <text x="595" y="150" text-anchor="middle" font-size="11" fill="#6366f1">已使用</text>

  <!-- EXPIRED -->
  <rect x="150" y="330" width="150" height="64" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="225" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">EXPIRED</text>
  <text x="225" y="380" text-anchor="middle" font-size="11" fill="#dc2626">已过期</text>

  <!-- REVOKED -->
  <rect x="390" y="330" width="150" height="64" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="465" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">REVOKED</text>
  <text x="465" y="380" text-anchor="middle" font-size="11" fill="#dc2626">已撤销</text>

  <!-- 起始点 -> AVAILABLE (发放) -->
  <ellipse cx="40" cy="60" rx="12" ry="12" fill="#16a34a"/>
  <line x1="46" y1="72" x2="82" y2="100" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="4" y="42" font-size="11" fill="#16a34a">发放</text>

  <!-- AVAILABLE -> LOCKED (锁定) -->
  <line x1="190" y1="132" x2="278" y2="132" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="234" y="122" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="500">锁定（订单创建）</text>

  <!-- LOCKED -> USED (支付成功/核销) -->
  <line x1="430" y1="132" x2="518" y2="132" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="474" y="122" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="500">支付成功（核销）</text>

  <!-- AVAILABLE -> EXPIRED (过期，批处理) -->
  <line x1="100" y1="164" x2="180" y2="328" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="88" y="300" font-size="11" fill="#dc2626">过期（批处理）</text>

  <!-- AVAILABLE -> REVOKED (撤销，运营操作) -->
  <line x1="150" y1="164" x2="430" y2="328" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <text x="252" y="228" font-size="11" fill="#dc2626">撤销（运营操作）</text>

  <!-- LOCKED -> AVAILABLE (取消/超时释放) -->
  <path d="M 300 164 Q 260 210 190 190 Q 120 170 105 168" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="168" y="204" text-anchor="middle" font-size="10" fill="#b45309">取消/超时释放</text>

  <!-- LOCKED -> EXPIRED (锁定到期，已过期) -->
  <line x1="330" y1="164" x2="270" y2="330" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="306" y="254" font-size="10" fill="#64748b">锁定到期（已过期）</text>

  <!-- LOCKED -> AVAILABLE (锁定到期，未过期) -->
  <path d="M 280 164 Q 200 230 115 230 Q 45 220 45 168" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="52" y="240" font-size="10" fill="#64748b">锁定到期（未过期）</text>

  <!-- USED -> AVAILABLE (全额退款，未过期) -->
  <path d="M 595 164 Q 595 480 115 480 Q 40 470 40 168" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <text x="360" y="472" text-anchor="middle" font-size="10" fill="#16a34a">全额退款（未过期）</text>

  <!-- USED -> EXPIRED (全额退款，已过期) -->
  <path d="M 570 164 Q 540 250 330 350" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <text x="528" y="246" font-size="10" fill="#dc2626">全额退款（已过期）</text>
</svg>
