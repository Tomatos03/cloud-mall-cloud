<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1320" height="780" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9 z" fill="#64748b"/>
    </marker>
    <clipPath id="cp_act"><rect x="40" y="70" width="380" height="300" rx="8"/></clipPath>
    <clipPath id="cp_audit"><rect x="40" y="440" width="380" height="300" rx="8"/></clipPath>
    <clipPath id="cp_prod"><rect x="560" y="70" width="340" height="300" rx="8"/></clipPath>
