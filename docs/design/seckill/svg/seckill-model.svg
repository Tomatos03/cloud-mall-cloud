  <!-- ============ cm_order（加列） ============ -->
  <g clip-path="url(#cp_cmorder)">
    <rect x="1040.0" y="440" width="200" height="140" fill="#334155"/>
    <rect x="1040.0" y="470" width="200" height="110" fill="#ffffff"/>
    <rect x="1040.0" y="478" width="200" height="16" fill="#f8fafc"/>
    <rect x="1040.0" y="440" width="200" height="140" rx="8" fill="none" stroke="#64748b"/>
