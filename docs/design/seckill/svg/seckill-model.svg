  <text x="1052.0" y="460" font-size="12" font-weight="700" fill="#ffffff">cm_order · 父订单</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0f172a">
    <text x="1050.0" y="492" font-weight="600">id</text><rect x="1218.0" y="481" width="24" height="14" rx="3" fill="#f59e0b"/><text x="1230.0" y="492" font-size="9" text-anchor="middle" fill="#ffffff">PK</text>
    <text x="1050.0" y="510">order_type</text>
  </g>
  <text x="1040.0" y="596" font-size="10" fill="#64748b">秒杀仅新增 order_type 列，由秒杀侧预生成 order_no 建单</text>

  <!-- 图例 -->
  <g>
    <rect x="1040.0" y="600" width="200" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="1052.0" y="610" width="24" height="14" rx="3" fill="#f59e0b"/><text x="1064.0" y="621" font-size="9" text-anchor="middle" fill="#ffffff">PK</text><text x="1082.0" y="620" font-size="10" fill="#475569">主键</text>
    <rect x="1130.0" y="610" width="24" height="14" rx="3" fill="#3b82f6"/><text x="1142.0" y="621" font-size="9" text-anchor="middle" fill="#ffffff">FK</text><text x="1160.0" y="620" font-size="10" fill="#475569">外键</text>
    <rect x="1208.0" y="610" width="24" height="14" rx="3" fill="#10b981"/><text x="1220.0" y="621" font-size="9" text-anchor="middle" fill="#ffffff">UK</text><text x="1238.0" y="620" font-size="10" fill="#475569">唯一</text>
    <line x1="1052" y1="648" x2="1086" y2="648" stroke="#64748b" stroke-width="1.5"/>
    <text x="1092.0" y="652" font-size="10" fill="#475569">1—N 外键关联（箭头指向子表）</text>
    <text x="1052.0" y="680" font-size="10" fill="#64748b">cm_seckill_order 关联 cm_order（order_no）</text>
    <text x="1052.0" y="700" font-size="10" fill="#64748b">cm_audit_record.biz_id 逻辑指向业务对象</text>
  </g>
</svg>
