    <polyline points="200,370 200,405 560,405 560,440" marker-end="url(#arr)"/>
    <polyline points="900,500 1040,500" marker-end="url(#arr)"/>
  </g>

  <g font-size="10" fill="#64748b">
    <text x="430" y="176">N</text><text x="552" y="176">1</text><text x="490" y="168" text-anchor="middle" font-weight="600" fill="#475569">activity_id</text>
    <text x="210" y="392">N</text><text x="550" y="392">1</text><text x="380" y="388" font-weight="600" fill="#475569">activity_id</text>
    <text x="910" y="492">N</text><text x="1030" y="492">1</text><text x="960" y="482" text-anchor="middle" font-weight="600" fill="#475569">order_no</text>
  </g>

