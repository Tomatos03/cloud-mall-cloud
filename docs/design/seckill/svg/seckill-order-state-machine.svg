<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">秒杀订单状态机</text>

  <!-- PENDING_PAYMENT -->
  <rect x="60" y="110" width="190" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="155" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">PENDING_PAYMENT</text>
  <text x="155" y="160" text-anchor="middle" font-size="11" fill="#b45309">待支付</text>

  <!-- PAID -->
  <rect x="360" y="110" width="150" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="435" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d">PAID</text>
  <text x="435" y="160" text-anchor="middle" font-size="11" fill="#16a34a">已支付</text>

  <!-- CANCELLED -->
  <rect x="150" y="280" width="190" height="64" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="245" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">CANCELLED</text>
  <text x="245" y="330" text-anchor="middle" font-size="11" fill="#dc2626">已取消（15min 未支付）</text>

  <!-- REFUNDED -->
  <rect x="540" y="280" width="150" height="64" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="615" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#4338ca">REFUNDED</text>
  <text x="615" y="330" text-anchor="middle" font-size="11" fill="#6366f1">已退款（预留）</text>

  <!-- 起始点 -> PENDING_PAYMENT (抢购成功) -->
  <ellipse cx="40" cy="60" rx="12" ry="12" fill="#f59e0b"/>
  <line x1="46" y1="72" x2="92" y2="110" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="4" y="42" font-size="11" fill="#b45309">抢购成功</text>

  <!-- PENDING_PAYMENT -> PAID (支付成功) -->
  <line x1="250" y1="142" x2="358" y2="142" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="304" y="132" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="500">支付成功</text>

  <!-- PENDING_PAYMENT -> CANCELLED (15min 未支付) -->
  <line x1="155" y1="174" x2="245" y2="278" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="148" y="240" font-size="11" fill="#dc2626">15min 未支付（xxl-job）</text>

  <!-- PAID -> REFUNDED (全额退款，预留) -->
  <path d="M 500 174 C 560 220, 580 240, 605 278" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="548" y="224" text-anchor="middle" font-size="10" fill="#4f46e5">全额退款（预留）</text>
</svg>
