<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">商品审核状态机</text>

  <!-- PENDING -->
  <rect x="150" y="110" width="150" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="225" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">PENDING</text>
  <text x="225" y="160" text-anchor="middle" font-size="11" fill="#b45309">待审核</text>

  <!-- APPROVED -->
  <rect x="420" y="70" width="150" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="495" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d">APPROVED</text>
  <text x="495" y="120" text-anchor="middle" font-size="11" fill="#16a34a">已通过</text>

  <!-- REJECTED -->
  <rect x="420" y="180" width="150" height="64" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="495" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">REJECTED</text>
  <text x="495" y="230" text-anchor="middle" font-size="11" fill="#dc2626">已驳回</text>

  <!-- 起始点 -> PENDING (商家提交) -->
  <ellipse cx="40" cy="142" rx="12" ry="12" fill="#f59e0b"/>
  <line x1="52" y1="142" x2="148" y2="142" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="4" y="124" font-size="11" fill="#b45309">商家提交</text>

  <!-- PENDING -> APPROVED (审核通过) -->
  <line x1="300" y1="126" x2="418" y2="102" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="366" y="108" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="500">审核通过</text>

  <!-- PENDING -> REJECTED (审核驳回) -->
  <line x1="300" y1="158" x2="418" y2="206" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="366" y="188" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="500">审核驳回</text>

  <!-- REJECTED -> PENDING (修改后重新提交) -->
  <path d="M 420 212 C 330 230, 290 180, 300 176" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="336" y="222" text-anchor="middle" font-size="10" fill="#64748b">修改后重新提交</text>
</svg>
