<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 680" width="1260" height="680"
     font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>秒杀异步建单与支付确认</title>
  <desc>抢购成功后经 SECKILL_ORDERS 异步建单，支付成功后经 ORDER_EVENTS 分别触发券核销与秒杀支付确认。</desc>
  <rect x="0" y="0" width="1260" height="680" fill="#ffffff"/>

  <defs>
    <marker id="sk-arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="630" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">秒杀异步建单与支付确认</text>
  <text x="630" y="55" text-anchor="middle" font-size="12" fill="#64748b">SECKILL_ORDERS 建单 → ORDER_EVENTS 支付确认，两条独立消费链路</text>

  <text x="40" y="96" font-size="12" font-weight="700" fill="#334155">① 抢购建单</text>

  <g>
    <rect x="40" y="108" width="140" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="110" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">用户</text>
    <text x="110" y="161" text-anchor="middle" font-size="10" fill="#1d4ed8">发起抢购</text>

    <rect x="220" y="108" width="210" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="325" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">seckill-service</text>
    <text x="325" y="157" text-anchor="middle" font-size="10" fill="#1d4ed8">写秒杀单</text>
    <text x="325" y="173" text-anchor="middle" font-size="10" fill="#1d4ed8">发送事务消息</text>

    <rect x="470" y="108" width="200" height="74" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.4"/>
    <text x="570" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SECKILL_ORDERS</text>
    <text x="570" y="159" text-anchor="middle" font-size="10" fill="#c2410c">SeckillOrderCreate</text>

    <rect x="710" y="108" width="210" height="74" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4"/>
    <text x="815" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">SeckillOrderConsumer</text>
    <text x="815" y="159" text-anchor="middle" font-size="10" fill="#7c3aed">seckill-order-events</text>

    <rect x="960" y="108" width="240" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="1080" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">order-service</text>
    <text x="1080" y="157" text-anchor="middle" font-size="10" fill="#1d4ed8">建真实订单</text>
    <text x="1080" y="173" text-anchor="middle" font-size="9.5" fill="#1d4ed8">CheckoutTypeEnum.SECKILL</text>
  </g>

  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <line x1="180" y1="145" x2="218" y2="145" marker-end="url(#sk-arrow)"/>
    <line x1="430" y1="145" x2="468" y2="145" marker-end="url(#sk-arrow)"/>
    <line x1="670" y1="145" x2="708" y2="145" marker-end="url(#sk-arrow)"/>
    <line x1="920" y1="145" x2="958" y2="145" marker-end="url(#sk-arrow)"/>
  </g>

  <rect x="980" y="210" width="200" height="42" rx="21" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="1080" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">用户支付成功</text>
  <line x1="1080" y1="182" x2="1080" y2="208" stroke="#64748b" stroke-width="1.6" marker-end="url(#sk-arrow)"/>

  <text x="40" y="278" font-size="12" font-weight="700" fill="#334155">② 支付成功 → 双消费组</text>

  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <polyline points="1080,252 1080,270 890,270 890,288" marker-end="url(#sk-arrow)"/>
  </g>

  <rect x="700" y="290" width="380" height="76" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.4"/>
  <text x="890" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ORDER_EVENTS</text>
  <text x="890" y="339" text-anchor="middle" font-size="10" fill="#c2410c">Tag: OrderPaid（不同消费组各收一份）</text>

  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <line x1="890" y1="366" x2="890" y2="388"/>
    <line x1="410" y1="388" x2="890" y2="388"/>
    <line x1="410" y1="388" x2="410" y2="408" marker-end="url(#sk-arrow)"/>
    <line x1="810" y1="388" x2="810" y2="408" marker-end="url(#sk-arrow)"/>
  </g>

  <g>
    <rect x="300" y="410" width="220" height="48" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="410" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">coupon-order-events</text>
    <text x="410" y="447" text-anchor="middle" font-size="9" fill="#7c3aed">券核销消费组</text>

    <rect x="700" y="410" width="220" height="48" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="810" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">seckill-order-paid</text>
    <text x="810" y="447" text-anchor="middle" font-size="9" fill="#7c3aed">秒杀支付确认组</text>
  </g>

  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <line x1="410" y1="458" x2="410" y2="498" marker-end="url(#sk-arrow)"/>
    <line x1="810" y1="458" x2="810" y2="498" marker-end="url(#sk-arrow)"/>
    <line x1="930" y1="540" x2="958" y2="540" marker-end="url(#sk-arrow)"/>
  </g>

  <g>
    <rect x="260" y="500" width="300" height="80" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="410" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">coupon-service</text>
    <text x="410" y="548" text-anchor="middle" font-size="10" fill="#be123c"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">commit-by-order</text>
    <text x="410" y="566" text-anchor="middle" font-size="10" fill="#be123c">核销订单下已锁定券</text>

    <rect x="680" y="500" width="250" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="805" y="526" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">SeckillOrderPaidHandler</text>
    <text x="805" y="548" text-anchor="middle" font-size="10" fill="#047857">SeckillPaidEvent</text>
    <text x="805" y="566" text-anchor="middle" font-size="10" fill="#047857">非 SK 前缀订单跳过</text>

    <rect x="960" y="500" width="280" height="80" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="1100" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">seckill-service</text>
    <text x="1100" y="548" text-anchor="middle" font-size="10" fill="#be123c"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">confirm-paid</text>
    <text x="1100" y="566" text-anchor="middle" font-size="10" fill="#be123c">置 PAID + 扣减秒杀池</text>
  </g>

  <text x="630" y="620" text-anchor="middle" font-size="10.5" fill="#475569">建单幂等：order-service 按 uk_order_no 去重，重复消费不产生重复订单。</text>
  <text x="630" y="642" text-anchor="middle" font-size="10.5" fill="#475569">支付确认幂等：秒杀单状态条件更新，stock &gt;= 1 兜底防负库存。</text>
</svg>
