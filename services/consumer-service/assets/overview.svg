<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"
     font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>consumer-service 总体消息链路</title>
  <desc>上游业务服务通过事务消息投递到 RocketMQ，consumer-service 统一消费后经 Feign 调用下游服务。</desc>
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <defs>
    <marker id="ov-arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">consumer-service 总体消息链路</text>
  <text x="600" y="58" text-anchor="middle" font-size="12" fill="#64748b">上游事务消息 → RocketMQ Topic → 消费模板分发 → Handler → Feign 下游</text>

  <text x="40" y="88" font-size="12" font-weight="700" fill="#334155">① 上游业务服务</text>

  <g>
    <rect x="60" y="98" width="240" height="62" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="180" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">order-service</text>
    <text x="180" y="144" text-anchor="middle" font-size="10.5" fill="#1d4ed8">支付 · 超时 · 取消 · 退款</text>

    <rect x="340" y="98" width="240" height="62" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="460" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">product-service</text>
    <text x="460" y="144" text-anchor="middle" font-size="10.5" fill="#1d4ed8">创建 · 更新 · 删除</text>

    <rect x="620" y="98" width="240" height="62" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="740" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">seckill-service</text>
    <text x="740" y="144" text-anchor="middle" font-size="10.5" fill="#1d4ed8">抢购成功 → 建单事件</text>

    <rect x="900" y="98" width="240" height="62" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="1020" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">user-service</text>
    <text x="1020" y="144" text-anchor="middle" font-size="10.5" fill="#1d4ed8">注册成功</text>
  </g>

  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <line x1="180" y1="160" x2="180" y2="204" marker-end="url(#ov-arrow)"/>
    <line x1="460" y1="160" x2="460" y2="204" marker-end="url(#ov-arrow)"/>
    <line x1="740" y1="160" x2="740" y2="204" marker-end="url(#ov-arrow)"/>
    <line x1="1020" y1="160" x2="1020" y2="204" marker-end="url(#ov-arrow)"/>
  </g>

  <text x="40" y="196" font-size="12" font-weight="700" fill="#334155">② RocketMQ Topic</text>

  <g>
    <rect x="60" y="208" width="240" height="68" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
    <text x="180" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ORDER_EVENTS</text>
    <text x="180" y="255" text-anchor="middle" font-size="10" fill="#c2410c">OrderPaid / Timeout / Cancelled / FullyRefunded</text>

    <rect x="340" y="208" width="240" height="68" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
    <text x="460" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PRODUCT_EVENTS</text>
    <text x="460" y="255" text-anchor="middle" font-size="10" fill="#c2410c">Created / Updated / Deleted</text>

    <rect x="620" y="208" width="240" height="68" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
    <text x="740" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SECKILL_ORDERS</text>
    <text x="740" y="255" text-anchor="middle" font-size="10" fill="#c2410c">SeckillOrderCreate</text>

    <rect x="900" y="208" width="240" height="68" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
    <text x="1020" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">USER_REGISTERED</text>
    <text x="1020" y="255" text-anchor="middle" font-size="10" fill="#c2410c">UserRegistered</text>
  </g>

  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <line x1="180" y1="276" x2="180" y2="314" marker-end="url(#ov-arrow)"/>
    <line x1="460" y1="276" x2="460" y2="314" marker-end="url(#ov-arrow)"/>
    <line x1="740" y1="276" x2="740" y2="314" marker-end="url(#ov-arrow)"/>
    <line x1="1020" y1="276" x2="1020" y2="314" marker-end="url(#ov-arrow)"/>
  </g>

  <rect x="40" y="316" width="1120" height="282" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="64" y="344" font-size="14" font-weight="700" fill="#6d28d9">③ consumer-service（独立消费进程）</text>

  <g text-anchor="middle">
    <rect x="60" y="360" width="196" height="56" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="158" y="383" font-size="11.5" font-weight="700" fill="#5b21b6">OrderEventConsumer</text>
    <text x="158" y="401" font-size="9.5" fill="#7c3aed">ORDER_EVENTS · 券</text>

    <rect x="272" y="360" width="196" height="56" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="370" y="383" font-size="11.5" font-weight="700" fill="#5b21b6">SeckillOrderPaidConsumer</text>
    <text x="370" y="401" font-size="9.5" fill="#7c3aed">ORDER_EVENTS · 秒杀</text>

    <rect x="484" y="360" width="196" height="56" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="582" y="383" font-size="11.5" font-weight="700" fill="#5b21b6">SeckillOrderConsumer</text>
    <text x="582" y="401" font-size="9.5" fill="#7c3aed">SECKILL_ORDERS</text>

    <rect x="696" y="360" width="196" height="56" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="794" y="383" font-size="11.5" font-weight="700" fill="#5b21b6">ProductEventConsumer</text>
    <text x="794" y="401" font-size="9.5" fill="#7c3aed">PRODUCT_EVENTS</text>

    <rect x="908" y="360" width="196" height="56" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="1006" y="383" font-size="11.5" font-weight="700" fill="#5b21b6">UserRegisteredConsumer</text>
    <text x="1006" y="401" font-size="9.5" fill="#7c3aed">USER_REGISTERED</text>
  </g>

  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <line x1="158" y1="416" x2="158" y2="424"/>
    <line x1="370" y1="416" x2="370" y2="424"/>
    <line x1="582" y1="416" x2="582" y2="424"/>
    <line x1="794" y1="416" x2="794" y2="424"/>
    <line x1="1006" y1="416" x2="1006" y2="424"/>
    <line x1="158" y1="424" x2="1006" y2="424"/>
    <line x1="600" y1="424" x2="600" y2="436" marker-end="url(#ov-arrow)"/>
    <line x1="600" y1="494" x2="600" y2="508" marker-end="url(#ov-arrow)"/>
  </g>

  <rect x="230" y="438" width="740" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="600" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">AbstractMessageConsumer&lt;T&gt;</text>
  <text x="600" y="481" text-anchor="middle" font-size="10" fill="#047857">JSON 反序列化 → tag 归一化 → 遍历处理器 canHandle</text>

  <rect x="230" y="510" width="740" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="600" y="532" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">IEventHandler&lt;T&gt; × 8</text>
  <text x="600" y="549" text-anchor="middle" font-size="10" fill="#047857">Feign 调用下游内部接口，下游保证幂等</text>

  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <line x1="600" y1="560" x2="600" y2="638" marker-end="url(#ov-arrow)"/>
    <line x1="160" y1="640" x2="1040" y2="640"/>
    <line x1="160" y1="640" x2="160" y2="680" marker-end="url(#ov-arrow)"/>
    <line x1="380" y1="640" x2="380" y2="680" marker-end="url(#ov-arrow)"/>
    <line x1="600" y1="640" x2="600" y2="680" marker-end="url(#ov-arrow)"/>
    <line x1="820" y1="640" x2="820" y2="680" marker-end="url(#ov-arrow)"/>
    <line x1="1040" y1="640" x2="1040" y2="680" marker-end="url(#ov-arrow)"/>
  </g>

  <text x="40" y="622" font-size="12" font-weight="700" fill="#334155">④ 下游业务服务</text>

  <g text-anchor="middle">
    <rect x="65" y="682" width="190" height="64" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="160" y="708" font-size="13" font-weight="700" fill="#9f1239">coupon-service</text>
    <text x="160" y="727" font-size="9.5" fill="#be123c">核销 · 释放 · 回退 · 发券</text>

    <rect x="285" y="682" width="190" height="64" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="380" y="708" font-size="13" font-weight="700" fill="#9f1239">order-service</text>
    <text x="380" y="727" font-size="9.5" fill="#be123c">秒杀建单</text>

    <rect x="505" y="682" width="190" height="64" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="600" y="708" font-size="13" font-weight="700" fill="#9f1239">seckill-service</text>
    <text x="600" y="727" font-size="9.5" fill="#be123c">支付确认</text>

    <rect x="725" y="682" width="190" height="64" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="820" y="708" font-size="13" font-weight="700" fill="#9f1239">product-service</text>
    <text x="820" y="727" font-size="9.5" fill="#be123c">拉取搜索文档</text>

    <rect x="945" y="682" width="190" height="64" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="1040" y="708" font-size="13" font-weight="700" fill="#9f1239">search-service</text>
    <text x="1040" y="727" font-size="9.5" fill="#be123c">ES upsert / delete</text>
  </g>

  <text x="600" y="774" text-anchor="middle" font-size="10" fill="#64748b">同一 Topic 的不同消费组各自收到一份消息；同一消费组内多实例竞争消费。</text>
</svg>
