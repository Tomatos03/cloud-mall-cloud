server:
  port: 9004

spring:
  application:
    name: im-service
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true
  config:
    import:
      - nacos:common
      - nacos:im-service

im:
  upload-dir: ${IM_UPLOAD_DIR:tmp/im-uploads}
  max-image-size: 10485760
  max-video-size: 104857600
